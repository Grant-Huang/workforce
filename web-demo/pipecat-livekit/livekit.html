<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LiveKit + Pipecat 对比 Demo</title>
  <link rel="stylesheet" href="/static/livekit-styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
</head>
<body>
  <header class="header">
    <div>
      <h1>LiveKit + Pipecat</h1>
      <p class="subtitle">模块化 STT → LLM → TTS pipeline（WebRTC 传输）</p>
    </div>
    <div id="modeSwitcher" class="modeSwitcherHost"></div>
  </header>

  <section class="panel status-panel">
    <div id="status" class="status">未连接</div>
    <div id="metrics" class="metrics"></div>
  </section>

  <section class="panel chat-panel">
    <div id="chat" class="chat"></div>
    <div id="empty" class="empty">连接后说话，转写和回复会显示在这里</div>
  </section>

  <footer class="controls">
    <button id="connectBtn" class="btn primary">连接并开始</button>
    <button id="disconnectBtn" class="btn" disabled>断开</button>
  </footer>

  <section class="panel info-panel">
    <h2>架构对比</h2>
    <table class="compare-table">
      <thead>
        <tr><th>维度</th><th>现有 Demo（8765）</th><th>本页面（8766）</th></tr>
      </thead>
      <tbody>
        <tr><td>传输</td><td>WebSocket 直连 relay</td><td>LiveKit Cloud WebRTC</td></tr>
        <tr><td>语音栈</td><td>Qwen Omni Realtime 端到端</td><td>SenseVoice STT + Qwen2.5 LLM + Qwen TTS（本地）</td></tr>
        <tr><td>编排</td><td>浏览器事件驱动</td><td>Pipecat frame pipeline</td></tr>
        <tr><td>VAD</td><td>服务端 server_vad</td><td>Silero VAD（本地）</td></tr>
      </tbody>
    </table>
  </section>

  <script src="/shared/mode-switcher.js"></script>
  <script src="/static/livekit-app.js"></script>
</body>
</html>
