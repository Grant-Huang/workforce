<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语音对话 Demo</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <select id="voiceSelect" class="voiceSelect" aria-label="选择音色" title="选择音色"></select>
      <span class="status" id="status">未连接</span>
    </header>

    <main class="chat" id="chat">
      <div class="empty" id="empty">
        <p>按下麦克风开始对话，或者直接在下面打字</p>
        <div class="suggestions" id="suggestions"></div>
      </div>
    </main>

    <!-- Shown instead of #chat while the voice session is active (docs/app-design.md
         8.3): the transcript keeps recording in the background as usual, it's just not
         displayed until the voice session ends, when #chat is revealed again. -->
    <div class="voiceOrbContainer" id="voiceOrbContainer" style="display:none">
      <div class="voiceOrb" id="voiceOrb"></div>
    </div>

    <footer class="controls">
      <!-- 一行放完打字/口述/语音三个入口，参照 ChatGPT App 的克制布局：一条胶囊装文字输入，
           右边贴一个独立的语音对话按钮，不再用大圆按钮单独占一整行。见 docs/app-design.md 第一节。 -->
      <div class="composerRow" id="composerRow">
        <form class="textRow" id="textForm">
          <input
            id="textInput"
            class="textInput"
            type="text"
            placeholder="询问或者说点什么…"
            autocomplete="off"
          />
          <button type="button" class="dictateBtn" id="dictateBtn" aria-label="语音输入转文字">🎙</button>
          <button type="submit" class="sendBtn" id="sendBtn" aria-label="发送">↑</button>
        </form>

        <button id="micBtn" class="micBtn" aria-label="开始/结束语音对话">
          <svg id="micIcon" viewBox="0 0 24 24" width="22" height="22" fill="none">
            <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" fill="currentColor"/>
            <path d="M19 11a7 7 0 0 1-14 0M12 19v3" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
          </svg>
          <svg id="stopIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" style="display:none">
            <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>
          </svg>
        </button>
      </div>

      <!-- 口述转文字：录音中显示这一排，替代上面那一整行。X 取消；■ 停止后整理成文字回填到
           输入框，可编辑再发；↑ 整理完直接发送，不用二次确认。见 docs/app-design.md 第三节。 -->
      <div class="dictationRow" id="dictationRow" style="display:none">
        <button type="button" class="dictationCancelBtn" id="dictationCancelBtn" aria-label="取消">✕</button>
        <span class="dictationStatus" id="dictationStatus">正在聆听…</span>
        <button type="button" class="dictationStopBtn" id="dictationStopBtn" aria-label="停止，整理后填入输入框">■</button>
        <button type="button" class="dictationSendBtn" id="dictationSendBtn" aria-label="整理后直接发送">↑</button>
      </div>
    </footer>
  </div>

  <script src="/static/memory.js"></script>
  <script src="/static/history.js"></script>
  <script src="/static/agentnexus.js"></script>
  <script src="/static/saveIntent.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
