name: VoiceChat
options:
  bundleIdPrefix: com.jacer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  # Swaps RealtimeClient off URLSessionWebSocketTask -- see the doc comment on
  # RealtimeClient for why (a real-device HTTP/2-ALPN incompatibility with
  # Aliyun's realtime endpoint that URLSessionWebSocketTask couldn't get past).
  Starscream:
    url: https://github.com/daltoniam/Starscream.git
    from: 4.0.8
targets:
  VoiceChat:
    type: application
    platform: iOS
    sources:
      - path: VoiceChat
    info:
      path: VoiceChat/Info.plist
    dependencies:
      - package: Starscream
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacer.voicechat
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
schemes:
  VoiceChat:
    build:
      targets:
        VoiceChat: all
    run:
      config: Debug
